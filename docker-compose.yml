# Infrastructure only. The two Spring Boot services are run from your terminal
# (see README.md) and connect to these containers over localhost.

services:

  # ---------------------------------------------------------------------------
  # Kafka broker - the only channel Order Service and Inventory Service use to
  # talk to each other. Runs in KRaft mode, so no ZooKeeper container is needed.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # This one container is both the broker (handles messages) and the
      # controller (manages cluster metadata). Fine for local development.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Ports Kafka binds inside the container.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # The address Kafka hands back to clients. Because the services run on your
      # machine rather than in Compose, it must advertise localhost.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      # Kafka's internal bookkeeping topics default to 3 copies; with a
      # single broker there is only 1 machine to hold them.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Don't wait before assigning topic partitions to a new consumer.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ---------------------------------------------------------------------------
  # PostgreSQL for Order Service only. Inventory Service never connects here.
  # ---------------------------------------------------------------------------
  order-db:
    image: postgres:16
    container_name: order-db
    ports:
      # host 5432 -> container 5432
      - "5432:5432"
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
    volumes:
      # Keeps table data across `docker compose down`.
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      # Marks the container "healthy" only once Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # PostgreSQL for Inventory Service only. Order Service never connects here.
  # ---------------------------------------------------------------------------
  inventory-db:
    image: postgres:16
    container_name: inventory-db
    ports:
      # host 5433 -> container 5432, so it doesn't collide with order-db
      - "5433:5432"
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventoryuser
      POSTGRES_PASSWORD: inventorypass
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventoryuser -d inventorydb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  order-db-data:
  inventory-db-data:
